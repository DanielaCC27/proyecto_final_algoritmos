<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker></defs>
<style>.c{fill:#e6f2ec;stroke:#00663F;stroke-width:1.5}.o{fill:#fff6e5;stroke:#c98a12;stroke-width:1.5}.g{fill:#eaf2f8;stroke:#2B6F9E;stroke-width:1.5}.t{font-size:15px;font-weight:bold;fill:#1d2330}.s{font-size:12.5px;fill:#3b4352}.l{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#f)}.cap{font-size:13px;fill:#5b6475;font-weight:bold;letter-spacing:1px}</style>
<text x="20" y="30" class="cap">FUERA DE LÍNEA (UNA VEZ)</text>
<rect x="20" y="45" width="230" height="90" rx="8" class="o"/><text x="35" y="72" class="t">20 PDF del docente</text><text x="35" y="95" class="s">articulos/*.pdf</text><text x="35" y="115" class="s">solo se leen, no se publican</text>
<rect x="300" y="45" width="250" height="90" rx="8" class="c"/><text x="315" y="72" class="t">extraccion.ExtractorPdf</text><text x="315" y="95" class="s">PDFBox: texto de las páginas 1-2</text><text x="315" y="115" class="s">abstract, título, autores (KMP)</text>
<rect x="600" y="45" width="230" height="90" rx="8" class="g"/><text x="615" y="72" class="t">datos/ (revisado)</text><text x="615" y="95" class="s">abstracts/01..20.txt</text><text x="615" y="115" class="s">metadatos.csv</text>
<rect x="600" y="160" width="230" height="95" rx="8" class="g"/><text x="615" y="187" class="t">datos/embeddings/</text><text x="615" y="210" class="s">glove_corpus_100d.txt</text><text x="615" y="230" class="s">sbert_minilm_384d.csv</text>
<rect x="300" y="160" width="250" height="95" rx="8" class="o"/><text x="315" y="187" class="t">Modelos preentrenados</text><text x="315" y="210" class="s">GloVe 100d → PreparadorGlove (Java)</text><text x="315" y="230" class="s">all-MiniLM-L6-v2 → script Python</text>
<path d="M250,90 L295,90" class="l"/><path d="M550,90 L595,90" class="l"/><path d="M550,207 L595,207" class="l"/><path d="M715,135 L715,155" class="l"/>
<line x1="20" y1="285" x2="1080" y2="285" stroke="#bbb" stroke-dasharray="6 5"/>
<text x="850" y="315" class="cap">APLICACIÓN (SERVIDOR JAVA)</text>
<rect x="20" y="330" width="230" height="110" rx="8" class="c"/><text x="35" y="357" class="t">datos.Corpus</text><text x="35" y="380" class="s">20 objetos modelo.Articulo</text><text x="35" y="400" class="s">número, título, autores,</text><text x="35" y="420" class="s">abstract</text>
<rect x="290" y="330" width="230" height="110" rx="8" class="c"/><text x="305" y="357" class="t">seguimiento.Preprocesador</text><text x="305" y="380" class="s">clases del seguimiento:</text><text x="305" y="400" class="s">minúsculas, solo letras, sin vacías</text><text x="305" y="420" class="s">→ términos y ranking (Counting Sort)</text>
<rect x="560" y="320" width="270" height="80" rx="8" class="c"/><text x="575" y="347" class="t">similitud (Req. 1)</text><text x="575" y="368" class="s">Levenshtein, Needleman-Wunsch,</text><text x="575" y="386" class="s">TF-IDF + coseno, Jaccard, GloVe, SBERT</text>
<rect x="560" y="410" width="270" height="80" rx="8" class="c"/><text x="575" y="437" class="t">clustering (Req. 2)</text><text x="575" y="458" class="s">single, complete, average linkage</text><text x="575" y="476" class="s">cofenética, silueta, Dendrograma SVG</text>
<rect x="560" y="500" width="270" height="80" rx="8" class="c"/><text x="575" y="527" class="t">busqueda (Req. 3)</text><text x="575" y="548" class="s">KMP, Boyer-Moore, Rabin-Karp</text><text x="575" y="566" class="s">preprocesar() + buscar()</text>
<rect x="860" y="380" width="225" height="140" rx="8" class="c"/><text x="875" y="407" class="t">web.ServidorWeb</text><text x="875" y="430" class="s">HttpServer del JDK</text><text x="875" y="450" class="s">/api/articulos, /api/ranking</text><text x="875" y="470" class="s">/api/similitud, /api/clustering</text><text x="875" y="490" class="s">/api/busqueda, JSON (web.Json)</text>
<rect x="850" y="545" width="230" height="75" rx="8" class="o"/><text x="865" y="572" class="t">Navegador</text><text x="865" y="593" class="s">web/index.html + app.js</text><text x="865" y="610" class="s">(Docker en Azure)</text>
<path d="M715,255 C715,290 135,290 135,325" class="l"/>
<path d="M250,385 L285,385" class="l"/><path d="M520,370 L555,360" class="l"/><path d="M520,400 L555,450" class="l"/><path d="M520,425 L555,540" class="l"/>
<path d="M830,360 L855,420" class="l"/><path d="M830,450 L855,450" class="l"/><path d="M830,540 L855,490" class="l"/><path d="M965,520 L965,540" class="l"/>
